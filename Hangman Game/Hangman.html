<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple Hangman fruit guessing game built with HTML, CSS and JavaScript."
    >

    <link rel="stylesheet" href="Hangman.css">

    <title>Hangman Game</title>
</head>

<body>

    <main class="game-container">

        <!-- Game Header -->
        <header class="game-header">

            <p class="wrong-guesses" aria-live="polite">
                Wrong Guesses:
                <span class="mistake">0</span>
                of
                <span class="max-wrong">0</span>
            </p>

            <button
                type="button"
                class="reset-btn"
                id="reset-btn"
            >
                Reset
            </button>

        </header>


        <!-- Hangman Illustration -->
        <section
            class="hangman-body"
            aria-label="Hangman drawing"
        >
            <span class="hangman-part base"></span>
            <span class="hangman-part pillar"></span>
            <span class="hangman-part beam"></span>
            <span class="hangman-part rope"></span>

            <span class="hangman-part head"></span>
            <span class="hangman-part body"></span>
            <span class="hangman-part left-arm"></span>
            <span class="hangman-part right-arm"></span>
            <span class="hangman-part left-leg"></span>
            <span class="hangman-part right-leg"></span>
        </section>


        <!-- Word Section -->
        <section class="guess-word" aria-label="Word to guess">

            <p class="word-hint">
                Guess the fruit name
            </p>

            <p
                class="word-spotlight"
                id="word-spotlight"
                aria-live="polite"
                aria-label="Current word"
            ></p>

        </section>


        <!-- Keyboard -->
        <section
            class="keyboard-section"
            aria-label="Letter keyboard"
        >
            <div
                class="keyboard-box"
                id="keyboard-box"
            ></div>
        </section>

    </main>


    <!-- Game Result -->
    <section
        class="result-box"
        id="result-box"
        aria-live="assertive"
        aria-hidden="true"
    >

        <div class="result-content">

            <h1 class="message">
                You Win!
            </h1>

            <p class="result-text">
                The word was
                <strong class="result-answer">
                    Javascript
                </strong>
            </p>

            <button
                type="button"
                class="game-btn"
                id="new-game-btn"
            >
                New Game
            </button>

        </div>

    </section>


    <script src="Hangman.js"></script>

</body>

</html>
